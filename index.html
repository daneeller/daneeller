<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>daneeller · GitHub</title>
  <meta http-equiv="refresh" content="2; url=https://github.com/daneeller" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #24292f 0%, #0d1117 70%);
      color: #e6edf3;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      max-width: 420px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      font-weight: 700;
      color: #58a6ff;
      border: 2px solid #30363d;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.subtitle { color: #8b949e; font-size: 14px; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #238636;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .tip { margin-top: 20px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">d</div>
    <h1>daneeller</h1>
    <p class="subtitle">正在跳转到我的 GitHub 主页…</p>
    <a class="btn" href="https://github.com/daneeller">前往 GitHub →</a>
    <p class="tip">如果没有自动跳转，请点击上方按钮</p>
  </div>
</body>
</html>
